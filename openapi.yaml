  /events/{event_id}/products:
    get:
      tags: [Products]
      summary: List Event Products
      description: |
        Retrieve all products (tickets) available for an event.
        
        **Product Information:**
        - Product types and categories
        - Pricing tiers and structures
        - Availability and inventory
        - Sale periods and restrictions
        - Tax and fee configurations
        
        **Pricing Features:**
        - Multiple price points per product
        - Early bird and late pricing
        - Group discounts and bulk pricing
        - Dynamic pricing capabilities
        - Currency-specific pricing
        
        **Availability Management:**
        - Total capacity and remaining inventory
        - Sale start and end dates
        - Per-order quantity limits
        - Real-time availability updates
        
        **Access Control:**
        - Public visibility settings
        - Restricted access products
        - Member-only pricing
        - Invitation-only products
      operationId: getProducts
      security:
        - ApiKeyAuth: []
        - JwtAuth: []
      parameters:
        - $ref: '#/components/parameters/EventId'
        - name: include_hidden
          in: query
          description: Include hidden products (admin only)
          schema:
            type: boolean
            default: false
        - name: category_id
          in: query
          description: Filter by product category
          schema:
            type: integer
        - name: include
          in: query
          description: Include related data
          schema:
            type: string
            example: "prices,category,statistics"
      responses:
        '200':
          description: Products retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductsListResponse'

    post:
      tags: [Products]
      summary: Create Product
      description: |
        Create a new product (ticket type) for an event.
        
        **Product Types:**
        - **FREE**: No charge products for general admission
        - **PAID**: Standard paid tickets with fixed pricing
        - **DONATION**: Pay-what-you-want products
        - **MEMBERSHIP**: Recurring or subscription-based access
        
        **Pricing Configuration:**
        - Base price and currency
        - Multiple pricing tiers
        - Early bird and promotional pricing
        - Group rates and bulk discounts
        - Tax and fee structures
        
        **Availability Settings:**
        - Total quantity available
        - Per-order purchase limits
        - Sale start and end dates
        - Visibility and access controls
        
        **Advanced Features:**
        - Product dependencies and bundles
        - Capacity assignments and allocations
        - Custom questions and data collection
        - Integration with external systems
      operationId: createProduct
      security:
        - JwtAuth: []
      parameters:
        - $ref: '#/components/parameters/EventId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProductRequest'
      responses:
        '201':
          description: Product created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'

  /events/{event_id}/products/{product_id}:
    get:
      tags: [Products]
      summary: Get Product Details
      description: |
        Retrieve detailed information for a specific product.
        
        **Detailed Information:**
        - Complete product configuration
        - All pricing tiers and options
        - Real-time availability status
        - Sales statistics and performance
        - Associated questions and requirements
        - Integration and webhook settings
        
        **Analytics Data:**
        - Sales velocity and trends
        - Conversion rates by traffic source
        - Pricing effectiveness analysis
        - Customer behavior insights
        - Revenue attribution data
      operationId: getProduct
      security:
        - ApiKeyAuth: []
        - JwtAuth: []
      parameters:
        - $ref: '#/components/parameters/EventId'
        - $ref: '#/components/parameters/ProductId'
        - name: include
          in: query
          description: Include related data
          schema:
            type: string
            example: "prices,category,questions,statistics"
      responses:
        '200':
          description: Product details retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDetailResponse'

    put:
      tags: [Products]
      summary: Update Product
      description: |
        Update product information and configuration.
        
        **Updatable Fields:**
        - Product name and description
        - Pricing and availability
        - Sale periods and restrictions
        - Visibility and access settings
        - Associated questions and requirements
        
        **Change Restrictions:**
        - Cannot modify products with active sales
        - Price increases may require customer notification
        - Capacity reductions must consider existing sales
        - Major changes may require republishing
        
        **Impact Analysis:**
        - Existing order compatibility
        - Customer communication requirements
        - Financial reconciliation needs
        - Inventory and capacity adjustments
      operationId: updateProduct
      security:
        - JwtAuth: []
      parameters:
        - $ref: '#/components/parameters/EventId'
        - $ref: '#/components/parameters/ProductId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProductRequest'
      responses:
        '200':
          description: Product updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'

    delete:
      tags: [Products]
      summary: Delete Product
      description: |
        Remove a product from the event (if no sales have occurred).
        
        **Deletion Requirements:**
        - No completed orders for this product
        - No pending orders in checkout
        - No affiliate or promotional dependencies
        - Organizer confirmation required
        
        **Alternative Actions:**
        - Hide product instead of deletion
        - Archive product for historical records
        - Redirect to alternative products
        - Refund existing orders if necessary
        
        **Impact Assessment:**
        - Effect on event capacity
        - Customer communication needs
        - Financial implications
        - Marketing and promotion updates
      operationId: deleteProduct
      security:
        - JwtAuth: []
      parameters:
        - $ref: '#/components/parameters/EventId'
        - $ref: '#/components/parameters/ProductId'
      responses:
        '204':
          description: Product deleted successfully
        '409':
          description: Cannot delete product with existing orders

  /events/{event_id}/products/sort:
    post:
      tags: [Products]
      summary: Reorder Products
      description: |
        Update the display order of products for an event.
        
        **Sorting Features:**
