          description: User profile updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'

  /users:
    get:
      tags: [Users]
      summary: List Users (Admin)
      description: |
        Retrieve a list of users within the organization (admin access required).
        
        **Admin Features:**
        - Complete user directory
        - Role and permission management
        - Activity and usage monitoring
        - Security and compliance oversight
        
        **Filtering Options:**
        - Role-based filtering
        - Activity status (active, inactive, suspended)
        - Registration date ranges
        - Email verification status
        - Account plan and features
        
        **User Information:**
        - Basic profile information
        - Role assignments and permissions
        - Last login and activity data
        - Account status and restrictions
        - Associated events and organizations
        
        **Privacy Controls:**
        - GDPR compliance features
        - Data access logging
        - Permission-based field visibility
        - User consent management
      operationId: getUsers
      security:
        - JwtAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Search'
        - name: filter[role]
          in: query
          description: Filter by user role
          schema:
            type: string
            enum: [ADMIN, ORGANIZER, USER]
        - name: filter[status]
          in: query
          description: Filter by account status
          schema:
            type: string
            enum: [ACTIVE, INACTIVE, SUSPENDED]
        - name: filter[verified]
