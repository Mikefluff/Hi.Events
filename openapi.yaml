    post:
      tags: [Orders]
      summary: Cancel Order
      description: |
        Cancel an order and process associated refunds and cleanup.
        
        **Cancellation Process:**
        - Validates cancellation eligibility
        - Calculates refund amounts
        - Processes payment reversals
        - Updates inventory and capacity
        - Notifies affected parties
        
        **Refund Processing:**
        - Automatic refunds to original payment method
        - Refund policy enforcement
        - Partial refund calculations
        - Fee handling and processing costs
        
        **Side Effects:**
        - Attendee registrations cancelled
        - Capacity freed for other customers
        - Analytics and reporting updates
        - Communication triggers
      operationId: cancelOrder
      security:
        - JwtAuth: []
      parameters:
        - $ref: '#/components/parameters/EventId'
        - $ref: '#/components/parameters/OrderId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  description: Reason for cancellation
                  example: "Customer request"
                refund_amount:
                  type: number
                  format: float
                  description: Custom refund amount (if different from policy)
                  example: 50.00
                notify_customer:
                  type: boolean
                  description: Whether to send cancellation email
                  default: true
      responses:
        '200':
          description: Order cancelled successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderCancellationResponse'

