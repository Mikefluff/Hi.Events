  # =============================================================================
  # PUBLIC API ENDPOINTS
  # =============================================================================

  /public/events/{event_id}:
    get:
      tags: [Public API]
      summary: Get Public Event Information
      description: |
        Retrieve public information about an event for display and registration purposes.
        
        **Public Information Includes:**
        - Event title, description, and details
        - Date, time, and location information
        - Organizer information and contact details
        - Available products and pricing
        - Event images and media
        - Public settings and configurations
        
        **Use Cases:**
        - Event listing and discovery pages
        - Registration and checkout flows
        - Social media sharing and promotion
        - Third-party integrations and widgets
        - Mobile applications and web embedding
        
        **Privacy & Security:**
        - Only publicly visible information
        - No sensitive financial or admin data
        - Rate limiting for public access
        - CORS support for web integration
        - Analytics and tracking support
      operationId: getPublicEvent
      parameters:
        - $ref: '#/components/parameters/EventId'
        - name: include
          in: query
          description: Include related public data
          schema:
            type: string
            example: "organizer,products,images"
      responses:
        '200':
          description: Public event information retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicEventResponse'
        '404':
          description: Event not found or not public

  /public/events/{event_id}/products:
    get:
      tags: [Public API]
      summary: Get Public Event Products
      description: |
        Retrieve publicly available products (tickets) for an event.
        
        **Product Information:**
        - Product categories and organization
        - Available products and descriptions
        - Current pricing and availability
        - Purchase limits and restrictions
        - Sale periods and deadlines
        
        **Real-time Data:**
        - Current inventory levels
        - Dynamic pricing updates
        - Promotional pricing active
        - Availability status changes
        - Capacity utilization
        
        **Integration Features:**
        - CORS support for web widgets
        - JSON-P callback support
        - Mobile-optimized responses
        - Caching headers for performance
        - Error handling for unavailable products
      operationId: getPublicEventProducts
      parameters:
        - $ref: '#/components/parameters/EventId'
      responses:
        '200':
          description: Public event products retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicEventProductsResponse'

  /public/events/{event_id}/order:
    post:
      tags: [Public API]
      summary: Create Public Order
      description: |
        Create a new order for public event registration (first step of checkout).
        
        **Order Creation Process:**
        1. **Product Selection**: Specify products and quantities
        2. **Availability Check**: Verify inventory and capacity
        3. **Pricing Calculation**: Apply promotions and calculate totals
        4. **Reservation Hold**: Create temporary order reservation
        5. **Session Management**: Establish checkout session
        
        **Supported Features:**
        - Multiple product types in single order
        - Promotional code application
        - Dynamic pricing and discounts
        - Inventory management and allocation
        - Session-based order tracking
        
        **Business Rules:**
        - Minimum and maximum quantity enforcement
        - Product combination restrictions
        - Capacity and availability validation
        - Pricing policy application
        - Fraud prevention and security checks
        
        **Next Steps:**
        After order creation, use the returned `short_id` to complete the order
        with attendee information and payment processing.
      operationId: createPublicOrder
      parameters:
        - $ref: '#/components/parameters/EventId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePublicOrderRequest'
            example:
              products:
                - product_id: 3
                  quantities:
                    - price_id: 3
                      quantity: 2
              promo_code: "EARLYBIRD25"
      responses:
        '201':
          description: Order created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatePublicOrderResponse'
        '422':
          description: Validation failed or products unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'

  /public/events/{event_id}/order/{order_short_id}:
    get:
      tags: [Public API]
      summary: Get Public Order Status
      description: |
        Retrieve the current status and details of a public order.
        
        **Order Information:**
        - Current order status and progress
        - Product details and quantities
        - Pricing breakdown and totals
        - Payment status and requirements
        - Attendee allocation and assignments
        - Order expiration and time limits
        
        **Status Tracking:**
        - **RESERVED**: Order created, awaiting completion
        - **COMPLETED**: Order finalized, payment processed
        - **EXPIRED**: Order timed out, reservation released
        - **CANCELLED**: Order cancelled by customer or system
        
        **Use Cases:**
        - Checkout progress tracking
        - Order confirmation and receipt display
        - Customer service and support
        - Payment status verification
        - Attendee information management
      operationId: getPublicOrder
      parameters:
        - $ref: '#/components/parameters/EventId'
        - name: order_short_id
          in: path
          required: true
          description: Short ID of the order from creation
          schema:
            type: string
            example: "o_4WWzp2nNQyjjI"
        - name: include
          in: query
          description: Include related data
          schema:
            type: string
            example: "attendees,payments,refunds"
      responses:
        '200':
          description: Order status retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicOrderResponse'
        '404':
          description: Order not found or expired

    put:
      tags: [Public API]
      summary: Complete Public Order
      description: |
        Complete a public order by providing attendee information and processing payment.
        
        **Completion Process:**
        1. **Attendee Information**: Collect required attendee details
        2. **Data Validation**: Verify all required information
        3. **Payment Processing**: Handle payment method and transactions
        4. **Order Finalization**: Confirm order and issue tickets
        5. **Notifications**: Send confirmations and receipts
        
        **Required Information:**
        - **Order Holder**: Contact information for order
        - **Attendees**: Details for each ticket/attendee
        - **Payment**: Payment method and processing
        - **Questions**: Custom registration questions
        - **Agreements**: Terms and conditions acceptance
        
        **Payment Methods:**
        - **Credit/Debit Cards**: Via Stripe integration
        - **PayPal**: Direct PayPal processing
        - **Bank Transfer**: For offline payment processing
        - **Cryptocurrency**: If enabled for event
        - **Free Orders**: No payment required
        
        **Validation Rules:**
        - Required field completion
        - Email format and validation
        - Phone number format verification
        - Custom question response validation
        - Terms and conditions acceptance
        
        **Post-Completion:**
        - Confirmation emails sent to attendees
        - Tickets generated with QR codes
        - Calendar invites and reminders
        - Check-in system activation
        - Analytics and reporting updates
      operationId: completePublicOrder
      parameters:
        - $ref: '#/components/parameters/EventId'
        - name: order_short_id
          in: path
          required: true
          description: Short ID of the order from creation
          schema:
            type: string
            example: "o_4WWzp2nNQyjjI"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompletePublicOrderRequest'
            example:
              order:
                first_name: "John"
                last_name: "Doe"
                email: "john.doe@example.com"
                phone: "+1-555-123-4567"
                address:
                  address_line_1: "123 Main St"
                  city: "New York"
                  state: "NY"
                  zip: "10001"
                  country: "US"
              products:
                - product_id: 3
                  product_price_id: 3
                  quantity: 2
                  attendees:
                    - first_name: "John"
                      last_name: "Doe"
                      email: "john.doe@example.com"
                      questions:
                        - question_id: 1
                          answer: "No dietary restrictions"
                    - first_name: "Jane"
                      last_name: "Doe"
                      email: "jane.doe@example.com"
                      questions:
                        - question_id: 1
                          answer: "Vegetarian"
              payment:
                method: "stripe"
                stripe_payment_intent_id: "pi_1234567890"
      responses:
        '200':
          description: Order completed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompletePublicOrderResponse'
        '400':
          description: Validation failed or payment processing error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'

# =============================================================================
# COMPONENTS & SCHEMAS
# =============================================================================

components:
  securitySchemes:
    ApiKeyAuth:
      type: http
      scheme: bearer
      bearerFormat: token
      description: |
        API key authentication using Bearer token format.
        
        **Format:** `Bearer {your_api_key}`
        
        **Example:** `Bearer 1|DBhrdNsgpn46IlYEwn4WdMhuhkR9eOMh30xTbQBBe5b9a2d7`
        
        **Obtaining API Keys:**
        1. Login to Hi.Events dashboard
        2. Navigate to Settings → API Keys
        3. Create new API key with required permissions
        4. Copy the generated token (shown only once)
        
        **Permissions:**
        - Read-only access to events and data
        - Limited write access for registrations
        - No access to sensitive administrative functions

    JwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT token authentication for full platform access.
        
        **Format:** `Bearer {jwt_token}`
        
        **Obtaining JWT Tokens:**
        1. Use `/auth/login` endpoint with credentials
        2. Receive access and refresh tokens
        3. Use access token for API requests
        4. Refresh when tokens expire
        
        **Permissions:**
        - Full administrative access
        - Complete CRUD operations
        - User and account management
        - Financial and sensitive data access

  parameters:
    EventId:
      name: event_id
      in: path
      required: true
      description: Unique identifier for the event
      schema:
        type: integer
        example: 1

    AttendeeId:
      name: attendee_id
      in: path
      required: true
      description: Unique identifier for the attendee
      schema:
        type: integer
        example: 123

    OrderId:
      name: order_id
      in: path
      required: true
      description: Unique identifier for the order
      schema:
        type: integer
        example: 456

    ProductId:
      name: product_id
      in: path
      required: true
      description: Unique identifier for the product
      schema:
        type: integer
        example: 789

    UserId:
      name: user_id
      in: path
      required: true
      description: Unique identifier for the user
      schema:
        type: integer
        example: 42

    Page:
      name: page
      in: query
      description: Page number for pagination
      schema:
        type: integer
        minimum: 1
        default: 1
        example: 1

    PerPage:
      name: per_page
      in: query
      description: Number of items per page
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
        example: 25

    Search:
      name: search
      in: query
      description: Search term for filtering results
      schema:
        type: string
        example: "conference"

    Sort:
      name: sort
      in: query
      description: Field to sort by
      schema:
        type: string
        example: "created_at"

    SortDirection:
      name: sort_direction
      in: query
      description: Sort direction
      schema:
        type: string
        enum: [asc, desc]
        default: desc
        example: "desc"

  schemas:
    # Authentication Schemas
    LoginRequest:
      type: object
      required: [email, password, account_id]
      properties:
        email:
          type: string
          format: email
          example: "user@example.com"
        password:
          type: string
          minLength: 8
          example: "password123"
        account_id:
          type: integer
          example: 1

    LoginResponse:
      type: object
      properties:
        access_token:
          type: string
          example: "eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9..."
        refresh_token:
          type: string
          example: "def50200abc123..."
        token_type:
          type: string
          example: "Bearer"
        expires_in:
          type: integer
          example: 3600
        user:
          $ref: '#/components/schemas/User'
        accounts:
          type: array
          items:
            $ref: '#/components/schemas/Account'

    RegisterRequest:
      type: object
      required: [first_name, last_name, email, password, organization_name]
      properties:
        first_name:
          type: string
          example: "John"
        last_name:
          type: string
          example: "Doe"
        email:
          type: string
          format: email
          example: "john@example.com"
        password:
          type: string
          minLength: 8
          example: "securepassword123"
        password_confirmation:
          type: string
          example: "securepassword123"
        organization_name:
          type: string
          example: "ACME Events"
        timezone:
          type: string
          example: "America/New_York"
        currency:
          type: string
          example: "USD"

    RegisterResponse:
      type: object
      properties:
        message:
          type: string
          example: "Registration successful"
        user:
          $ref: '#/components/schemas/User'
        account:
          $ref: '#/components/schemas/Account'

    # API Key Schemas
    ApiKey:
      type: object
      properties:
        id:
          type: integer
          example: 123
        name:
          type: string
          example: "Mobile App Integration"
        abilities:
          type: array
          items:
            type: string
          example: ["events:read", "orders:create"]
        last_used_at:
          type: string
          format: date-time
          nullable: true
          example: "2025-01-15T10:30:00Z"
        expires_at:
          type: string
          format: date-time
          nullable: true
          example: "2026-01-15T00:00:00Z"
        created_at:
          type: string
          format: date-time
          example: "2025-01-01T00:00:00Z"

    CreateApiKeyRequest:
      type: object
      required: [token_name]
      properties:
        token_name:
          type: string
          example: "Mobile App Integration"
        abilities:
          type: array
          items:
            type: string
          example: ["events:read", "orders:create"]
          default: ["*"]
        expires_at:
          type: string
          format: date-time
          nullable: true
          example: "2026-01-15T00:00:00Z"

    CreateApiKeyResponse:
      type: object
      properties:
        token:
          type: string
          example: "1|DBhrdNsgpn46IlYEwn4WdMhuhkR9eOMh30xTbQBBe5b9a2d7"
          description: "The actual API key - only shown once!"
        api_key:
          $ref: '#/components/schemas/ApiKey'

    # Event Schemas
    EventsListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/EventSummary'
        links:
          $ref: '#/components/schemas/PaginationLinks'
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    EventSummary:
      type: object
      properties:
        id:
          type: integer
          example: 1
        title:
          type: string
          example: "Tech Conference 2025"
        description:
          type: string
          example: "<p>Join us for an amazing tech conference</p>"
        description_preview:
          type: string
          example: "Join us for an amazing tech conference"
        start_date:
          type: string
          format: date-time
          example: "2025-07-15T09:00:00Z"
        end_date:
          type: string
          format: date-time
          example: "2025-07-15T18:00:00Z"
        status:
          type: string
          enum: [DRAFT, LIVE, ARCHIVED]
          example: "LIVE"
        lifecycle_status:
          type: string
          enum: [UPCOMING, ONGOING, ENDED]
          example: "UPCOMING"
        currency:
          type: string
          example: "USD"
        timezone:
          type: string
          example: "America/New_York"
        slug:
          type: string
          example: "tech-conference-2025"
        images:
          type: array
          items:
            type: string
          example: []
        organizer:
          $ref: '#/components/schemas/Organizer'
        statistics:
          $ref: '#/components/schemas/EventStatistics'

    CreateEventRequest:
      type: object
      required: [title, start_date, end_date, timezone, currency, organizer_id]
      properties:
        title:
          type: string
          maxLength: 255
          example: "Tech Conference 2025"
        description:
          type: string
          example: "<p>Join us for an amazing tech conference with industry leaders.</p>"
        start_date:
          type: string
          format: date-time
          example: "2025-07-15T09:00:00Z"
        end_date:
          type: string
          format: date-time
          example: "2025-07-15T18:00:00Z"
        timezone:
          type: string
          example: "America/New_York"
        currency:
          type: string
          example: "USD"
        organizer_id:
          type: integer
          example: 1
        location_details:
          type: string
          nullable: true
          example: "123 Conference Center, Tech City"
        is_online_event:
          type: boolean
          default: false
          example: false
        online_event_connection_details:
          type: string
          nullable: true
          example: "Join via Zoom: https://zoom.us/j/123456789"
        settings:
          $ref: '#/components/schemas/EventSettingsInput'

    EventSettingsInput:
      type: object
      properties:
        support_email:
          type: string
          format: email
          example: "support@techconf.com"
        order_timeout_in_minutes:
          type: integer
          default: 15
          example: 15
        required_attendee_details:
          type: boolean
          default: true
          example: true
        homepage_background_color:
          type: string
          pattern: '^#[0-9A-Fa-f]{6}$'
          example: "#ffffff"
        homepage_primary_color:
          type: string
          pattern: '^#[0-9A-Fa-f]{6}$'
          example: "#007bff"

    # User and Account Schemas
    User:
      type: object
      properties:
        id:
          type: integer
          example: 42
        first_name:
          type: string
          example: "John"
        last_name:
          type: string
          example: "Doe"
        email:
          type: string
          format: email
          example: "john@example.com"
        phone:
          type: string
          nullable: true
          example: "+1-555-123-4567"
        timezone:
          type: string
          example: "America/New_York"
        locale:
          type: string
          example: "en"
        email_verified_at:
          type: string
          format: date-time
          nullable: true
          example: "2025-01-01T12:00:00Z"
        created_at:
          type: string
          format: date-time
          example: "2025-01-01T00:00:00Z"

    Account:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: "ACME Events"
        currency:
          type: string
          example: "USD"
        timezone:
          type: string
          example: "America/New_York"
        created_at:
          type: string
          format: date-time
          example: "2025-01-01T00:00:00Z"

    Organizer:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: "Tech Events Inc"
        email:
          type: string
          format: email
          example: "contact@techevents.com"
        phone:
          type: string
          nullable: true
          example: "+1-555-987-6543"
        website:
          type: string
          nullable: true
          example: "https://techevents.com"
        description:
          type: string
          nullable: true
          example: "Leading tech event organizer"

    EventStatistics:
      type: object
      properties:
        unique_views:
          type: integer
          example: 1250
        total_views:
          type: integer
          example: 2100
        sales_total_gross:
          type: number
          format: float
          example: 15750.00
        total_tax:
          type: number
          format: float
          example: 1260.00
        sales_total_before_additions:
          type: number
