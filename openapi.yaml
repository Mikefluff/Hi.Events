  # =============================================================================
  # ADDITIONAL MISSING ROUTES
  # =============================================================================

  # WEBHOOK MANAGEMENT
  /events/{event_id}/webhooks:
    get:
      tags: [Webhooks]
      summary: List Event Webhooks
      description: |
        Retrieve all webhook endpoints configured for an event.
        
        **Webhook Types:**
        - Order creation and completion
        - Payment processing events
        - Attendee check-ins
        - Event status changes
        - Refund notifications
        
        **Security Features:**
        - HMAC signature verification
        - Retry logic with exponential backoff
        - Delivery status tracking
        - Event filtering and targeting
      operationId: getEventWebhooks
      security:
        - JwtAuth: []
      parameters:
        - $ref: '#/components/parameters/EventId'
      responses:
        '200':
          description: Webhooks retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhooksListResponse'

    post:
      tags: [Webhooks]
      summary: Create Event Webhook
      description: |
        Create a new webhook endpoint for event notifications.
        
        **Configuration Options:**
        - Target URL and HTTP method
        - Event types to subscribe to
        - Custom headers and authentication
        - Retry and timeout settings
        - Active/inactive status
      operationId: createEventWebhook
      security:
        - JwtAuth: []
      parameters:
        - $ref: '#/components/parameters/EventId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWebhookRequest'
      responses:
        '201':
          description: Webhook created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookResponse'

  /events/{event_id}/webhooks/{webhook_id}:
    get:
      tags: [Webhooks]
      summary: Get Webhook Details
      description: Retrieve detailed information for a specific webhook including delivery history.
      operationId: getEventWebhook
      security:
        - JwtAuth: []
      parameters:
        - $ref: '#/components/parameters/EventId'
        - name: webhook_id
          in: path
          required: true
          schema:
            type: integer
            example: 123
      responses:
        '200':
          description: Webhook details retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookDetailResponse'

    put:
      tags: [Webhooks]
      summary: Update Webhook
      description: Update webhook configuration and settings.
      operationId: updateEventWebhook
      security:
        - JwtAuth: []
      parameters:
        - $ref: '#/components/parameters/EventId'
        - name: webhook_id
          in: path
          required: true
          schema:
            type: integer
            example: 123
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateWebhookRequest'
      responses:
        '200':
          description: Webhook updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookResponse'

    delete:
      tags: [Webhooks]
      summary: Delete Webhook
      description: Remove a webhook endpoint from the event.
      operationId: deleteEventWebhook
      security:
        - JwtAuth: []
      parameters:
        - $ref: '#/components/parameters/EventId'
        - name: webhook_id
          in: path
          required: true
          schema:
            type: integer
            example: 123
      responses:
        '204':
          description: Webhook deleted successfully

