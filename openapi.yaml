        - Widget and embed ordering
        
        **Best Practices:**
        - Popular products first
        - Logical price progression
        - Category groupings
        - Seasonal or time-based ordering
      operationId: sortProducts
      security:
        - JwtAuth: []
      parameters:
        - $ref: '#/components/parameters/EventId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [product_orders]
              properties:
                product_orders:
                  type: array
                  items:
                    type: object
                    required: [product_id, order]
                    properties:
                      product_id:
                        type: integer
                        example: 123
                      order:
                        type: integer
                        example: 1
      responses:
        '200':
          description: Products reordered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

