openapi: 3.0.3
info:
  title: Hi.Events - Complete API Documentation
  description: |
    **Hi.Events** is a comprehensive event management platform that provides APIs for creating, managing, and selling tickets for events.
    
    ## 🚀 Key Features
    
    - **Event Management**: Create and manage events with detailed settings
    - **Ticket Sales**: Multiple product types, pricing tiers, and payment processing
    - **Attendee Management**: Check-ins, communications, and reporting
    - **Marketing Tools**: Promo codes, affiliates, and messaging
    - **Analytics**: Comprehensive reporting and statistics
    - **Integrations**: Webhooks, Stripe, and third-party services
    
    ## 🔐 Authentication
    
    **Two Authentication Methods:**
    
    1. **JWT Tokens** - For user sessions and full administrative access
    2. **API Keys** - For programmatic access with limited scope
    
    ## 📱 Public API
    
    Many endpoints are publicly accessible for:
    - Event discovery and registration
    - Ticket purchasing workflow
    - Check-in processes
    - Public event information
    
    ## 🎯 Quick Start
    
    ### Event Registration Workflow
    ```bash
    # 1. Browse Events (API Key required)
    curl -H "Authorization: Bearer YOUR_API_KEY" https://localhost:8443/api/events
    
    # 2. Get Event Products (Public)
    curl https://localhost:8443/api/public/events/1/products
    
    # 3. Create Order (Public)
    curl -X POST https://localhost:8443/api/public/events/1/order \
      -d '{"products":[{"product_id":3,"quantities":[{"price_id":3,"quantity":1}]}]}'
    
    # 4. Complete Order (Public)
    curl -X PUT https://localhost:8443/api/public/events/1/order/ORDER_ID \
      -d '{"order":{"first_name":"John","last_name":"Doe","email":"john@example.com"}}'
    ```
    
    ## 🏗️ Architecture
    
    - **Backend**: Laravel PHP framework
    - **Authentication**: Laravel Sanctum (API keys) + JWT
    - **Payment Processing**: Stripe integration
    - **File Storage**: Local/cloud storage for images and documents
    - **Real-time**: WebSocket support for live updates
    
    ## 📊 Rate Limiting
    
    - **Authenticated requests**: 1000 requests per minute
    - **Public requests**: 60 requests per minute
    - **Payment requests**: 10 requests per minute
    
    ## 🔧 Development Setup
    
    For local development with self-signed certificates, use the `-k` flag with curl.
    
  version: 2.0.0
  contact:
    name: Hi.Events Support
    email: support@hi.events
    url: https://hi.events
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: https://localhost:8443/api
    description: Local Development Server
  - url: https://api.hi.events
    description: Production Server

security:
  - ApiKeyAuth: []
  - JwtAuth: []
  - {}

paths:
  # =============================================================================
  # AUTHENTICATION & AUTHORIZATION
  # =============================================================================
  
  /auth/login:
    post:
      tags: [Authentication]
      summary: User Login
      description: |
        Authenticate a user with email and password to receive JWT tokens.
        
        **Returns:**
        - Access token for API requests
        - Refresh token for token renewal
        - User account information
        
        **Use Cases:**
        - Web application login
        - Mobile app authentication
        - Administrative dashboard access
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: "user@example.com"
              password: "password123"
              account_id: 1
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/register:
    post:
      tags: [Authentication]
      summary: User Registration
      description: |
        Register a new user account and create the initial account structure.
        
        **Features:**
        - Creates user account
        - Sets up initial organization
        - Configures default settings
        - Sends welcome email
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Registration successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
        '422':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'

  /auth/logout:
    post:
      tags: [Authentication]
      summary: User Logout
      description: |
        Logout the current user and invalidate the JWT token.
        
        **Security:**
        - Invalidates current access token
        - Clears server-side session
        - Logs security event
      operationId: logout
      security:
        - JwtAuth: []
      responses:
        '200':
          description: Logout successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /auth/refresh:
    post:
      tags: [Authentication]
      summary: Refresh JWT Token
      description: |
        Refresh an expired or expiring JWT token using a refresh token.
        
        **Token Management:**
        - Validates refresh token
        - Issues new access token
        - Optionally rotates refresh token
      operationId: refreshToken
      security:
        - JwtAuth: []
      responses:
        '200':
          description: Token refreshed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'

  /auth/forgot-password:
    post:
      tags: [Authentication]
      summary: Request Password Reset
      description: |
        Send a password reset email to the user's registered email address.
        
        **Process:**
        - Validates email exists
        - Generates secure reset token
        - Sends email with reset link
        - Token expires in 60 minutes
      operationId: forgotPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
                  example: "user@example.com"
      responses:
        '200':
          description: Reset email sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /auth/reset-password/{reset_token}:
    post:
      tags: [Authentication]
      summary: Reset Password
      description: |
        Reset user password using a valid reset token from email.
        
        **Security:**
        - Validates reset token
        - Enforces password strength
        - Invalidates all existing sessions
        - Logs security event
      operationId: resetPassword
      parameters:
        - name: reset_token
          in: path
          required: true
          schema:
            type: string
            example: "abc123def456"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password, password_confirmation]
              properties:
                password:
                  type: string
                  minLength: 8
                  example: "newpassword123"
                password_confirmation:
                  type: string
                  example: "newpassword123"
      responses:
        '200':
          description: Password reset successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  # =============================================================================
  # API KEY MANAGEMENT
  # =============================================================================

  /api-keys:
    get:
      tags: [API Keys]
      summary: List API Keys
      description: |
        Retrieve all API keys for the authenticated user.
        
        **Information Included:**
        - Token names and abilities
        - Creation and expiration dates
        - Usage statistics
        - Last used timestamps
        
        **Security Note:** Actual token values are never returned.
      operationId: getApiKeys
      security:
        - JwtAuth: []
      responses:
        '200':
          description: API keys retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ApiKey'

    post:
      tags: [API Keys]
      summary: Create API Key
      description: |
        Create a new API key with specified permissions and expiration.
        
        **Features:**
        - Custom token names
        - Granular permissions (abilities)
        - Optional expiration dates
        - Usage tracking
        
        **Important:** The actual token is only shown once during creation.
      operationId: createApiKey
      security:
        - JwtAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateApiKeyRequest'
      responses:
        '201':
          description: API key created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateApiKeyResponse'

  /api-keys/{token_id}:
    delete:
      tags: [API Keys]
      summary: Revoke API Key
      description: |
        Permanently revoke an API key, making it unusable for future requests.
        
        **Effects:**
        - Immediately invalidates the token
        - Stops all active requests using this token
        - Cannot be undone
        - Logs security event
      operationId: revokeApiKey
      security:
        - JwtAuth: []
      parameters:
        - name: token_id
          in: path
          required: true
          schema:
            type: integer
            example: 123
      responses:
        '204':
          description: API key revoked successfully
        '404':
          description: API key not found

  # =============================================================================
  # EVENT MANAGEMENT
  # =============================================================================

  /events:
    get:
      tags: [Events]
      summary: List Events
      description: |
        Retrieve a paginated list of events with filtering and sorting options.
        
        **Available Filters:**
        - Event status (DRAFT, LIVE, ARCHIVED)
        - Date ranges (start_date, end_date)
        - Organizer
        - Title search
        
        **Sorting Options:**
        - Start/end dates
        - Creation date
        - Title alphabetical
        - Last updated
        
        **Use Cases:**
        - Event discovery for registration
        - Administrative event management
        - Analytics and reporting
      operationId: getEvents
      security:
        - ApiKeyAuth: []
        - JwtAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/SortDirection'
        - name: filter[title]
          in: query
          description: Filter by event title (partial match)
          schema:
            type: string
            example: "conference"
        - name: filter[status]
          in: query
          description: Filter by event status
          schema:
            type: string
            enum: [DRAFT, LIVE, ARCHIVED]
            example: LIVE
        - name: filter[organizer_id]
          in: query
          description: Filter by organizer ID
          schema:
            type: integer
            example: 1
        - name: filter[start_date]
          in: query
          description: Filter events starting after this date
          schema:
            type: string
            format: date
            example: "2025-01-01"
        - name: filter[end_date]
          in: query
          description: Filter events ending before this date
          schema:
            type: string
            format: date
            example: "2025-12-31"
      responses:
        '200':
          description: Events retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventsListResponse'

    post:
      tags: [Events]
      summary: Create Event
      description: |
        Create a new event with basic information and settings.
        
        **Required Information:**
        - Event title and description
        - Start and end dates
        - Timezone and currency
        - Organizer assignment
        
        **Optional Features:**
        - Custom event settings
        - Image uploads
        - SEO configuration
        - Payment provider setup
        
        **Post-Creation Steps:**
        1. Add products/tickets
        2. Configure event settings
        3. Set up payment processing
        4. Publish event
      operationId: createEvent
      security:
        - ApiKeyAuth: []
        - JwtAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEventRequest'
          multipart/form-data:
            schema:
              allOf:
                - $ref: '#/components/schemas/CreateEventRequest'
                - type: object
                  properties:
                    images:
                      type: array
                      items:
                        type: string
                        format: binary
      responses:
        '201':
          description: Event created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventResponse'
        '422':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'

  /events/{event_id}:
    get:
      tags: [Events]
      summary: Get Event Details
      description: |
        Retrieve comprehensive details for a specific event.
        
        **Information Included:**
        - Basic event information
        - Settings and configuration
        - Statistics and metrics
        - Associated organizer
        - Images and media
        - Products/tickets overview
        
        **Access Control:**
        - Event owners: Full access
        - API keys: Read-only access
        - Public: Limited information via public endpoints
      operationId: getEvent
      security:
        - ApiKeyAuth: []
        - JwtAuth: []
      parameters:
        - $ref: '#/components/parameters/EventId'
        - name: include
          in: query
          description: Include related data (comma-separated)
          schema:
            type: string
            example: "organizer,statistics,products"
      responses:
        '200':
          description: Event details retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventDetailResponse'
        '404':
          description: Event not found

    put:
      tags: [Events]
      summary: Update Event
      description: |
        Update event information and settings.
        
        **Updatable Fields:**
        - Basic information (title, description, dates)
        - Event settings and configuration
        - SEO and marketing settings
        - Image management
        
        **Restrictions:**
        - Cannot change fundamental settings after tickets are sold
        - Date changes may require attendee notification
        - Some changes require event republishing
      operationId: updateEvent
      security:
        - ApiKeyAuth: []
        - JwtAuth: []
      parameters:
        - $ref: '#/components/parameters/EventId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateEventRequest'
      responses:
        '200':
          description: Event updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventResponse'

    delete:
      tags: [Events]
      summary: Delete Event
      description: |
        Permanently delete an event and all associated data.
        
        **⚠️ WARNING: This action cannot be undone!**
        
        **What Gets Deleted:**
        - Event information and settings
        - All products/tickets
        - Attendee records
        - Order history
        - Messages and communications
        - Analytics data
        
        **Prerequisites:**
        - No pending orders
        - All refunds processed
        - Organizer confirmation required
      operationId: deleteEvent
      security:
        - JwtAuth: []
      parameters:
        - $ref: '#/components/parameters/EventId'
      responses:
        '204':
          description: Event deleted successfully
        '409':
          description: Cannot delete event with active orders

  /events/{event_id}/status:
    put:
      tags: [Events]
      summary: Update Event Status
      description: |
        Change the publication status of an event.
        
        **Status Options:**
        - **DRAFT**: Event is being prepared, not visible to public
        - **LIVE**: Event is published and accepting registrations
        - **ARCHIVED**: Event is completed, read-only mode
        
        **Status Transitions:**
        - DRAFT → LIVE: Publishes event, starts ticket sales
        - LIVE → ARCHIVED: Ends sales, preserves data
        - ARCHIVED → LIVE: Reopens event (if end date allows)
        
        **Automated Status Changes:**
        - Events automatically become LIVE at start date
        - Events can auto-archive after end date
      operationId: updateEventStatus
      security:
        - ApiKeyAuth: []
        - JwtAuth: []
      parameters:
        - $ref: '#/components/parameters/EventId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [DRAFT, LIVE, ARCHIVED]
                  example: "LIVE"
                reason:
                  type: string
                  description: Optional reason for status change
                  example: "Event ready for public registration"
      responses:
        '200':
          description: Event status updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventResponse'

  /events/{event_id}/duplicate:
    post:
      tags: [Events]
      summary: Duplicate Event
      description: |
        Create a copy of an existing event with customizable duplication options.
        
        **Duplication Options:**
        - **Basic Info**: Title, description, settings
        - **Products**: Tickets and pricing structure
        - **Questions**: Custom registration questions
        - **Webhooks**: Integration endpoints
        - **Images**: Event photos and branding
        
        **What's NOT Duplicated:**
        - Attendee data and registrations
        - Order history and payments
        - Messages and communications
        - Analytics and statistics
        
        **Use Cases:**
        - Recurring events (monthly meetups, annual conferences)
        - Event templates and standardization
        - A/B testing different configurations
        - Regional event variations
      operationId: duplicateEvent
      security:
        - JwtAuth: []
      parameters:
        - $ref: '#/components/parameters/EventId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DuplicateEventRequest'
      responses:
        '201':
          description: Event duplicated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventResponse'

  # =============================================================================
  # ATTENDEE MANAGEMENT
  # =============================================================================

  /events/{event_id}/attendees:
    get:
      tags: [Attendees]
      summary: List Event Attendees
      description: |
        Retrieve a paginated list of attendees for an event with filtering and search.
        
        **Available Filters:**
        - Check-in status
        - Registration date range
        - Product/ticket type
        - Payment status
        - Custom question answers
        
        **Search Capabilities:**
        - Name search (first, last, or full name)
        - Email address search
        - Ticket reference search
        - Phone number search
        
        **Export Options:**
        - CSV export with custom fields
        - Excel export with multiple sheets
        - PDF attendee lists for printing
        
        **Privacy & Security:**
        - PII access requires appropriate permissions
        - Audit logging for data access
        - GDPR compliance features
      operationId: getAttendees
      security:
        - ApiKeyAuth: []
        - JwtAuth: []
      parameters:
        - $ref: '#/components/parameters/EventId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Search'
        - name: filter[checked_in]
          in: query
          description: Filter by check-in status
          schema:
            type: boolean
            example: true
        - name: filter[product_id]
          in: query
          description: Filter by product/ticket type
          schema:
            type: integer
            example: 123
        - name: filter[registration_date]
          in: query
          description: Filter by registration date range
          schema:
            type: string
            format: date
            example: "2025-01-01"
        - name: include
          in: query
          description: Include related data
          schema:
            type: string
            example: "order,product,check_ins"
      responses:
        '200':
          description: Attendees retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttendeesListResponse'

    post:
      tags: [Attendees]
      summary: Create Manual Attendee Registration
      description: |
        Manually register an attendee for an event (admin/organizer only).
        
        **Use Cases:**
        - Comp tickets and complimentary registrations
        - VIP registrations and special guests
        - Group registrations and bulk imports
        - Walk-in registrations at the door
        - Partner and sponsor attendees
        
        **Features:**
        - Skip payment processing
        - Custom pricing and discounts
        - Administrative notes
        - Automatic confirmation emails
        - Integration with check-in systems
        
        **Data Requirements:**
        - Basic attendee information
        - Product/ticket selection
        - Optional custom question responses
        - Optional order holder information
      operationId: createAttendee
      security:
        - ApiKeyAuth: []
        - JwtAuth: []
      parameters:
        - $ref: '#/components/parameters/EventId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAttendeeRequest'
      responses:
        '201':
          description: Attendee created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttendeeResponse'

  /events/{event_id}/attendees/{attendee_id}:
    get:
      tags: [Attendees]
      summary: Get Attendee Details
      description: |
        Retrieve detailed information for a specific attendee.
        
        **Information Included:**
        - Personal information and contact details
        - Registration and ticket information
        - Check-in history and timestamps
        - Order and payment details
        - Custom question responses
        - Communication history
        - Affiliate and promotional code usage
        
        **Privacy Considerations:**
        - Full access for event organizers
        - Limited access for API keys
        - Attendee can access their own data
        - Audit logging for PII access
      operationId: getAttendee
      security:
        - ApiKeyAuth: []
        - JwtAuth: []
      parameters:
        - $ref: '#/components/parameters/EventId'
        - $ref: '#/components/parameters/AttendeeId'
        - name: include
          in: query
          description: Include related data
          schema:
            type: string
            example: "order,check_ins,messages"
      responses:
        '200':
          description: Attendee details retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttendeeDetailResponse'

    put:
      tags: [Attendees]
      summary: Update Attendee Information
      description: |
        Update attendee information and registration details.
        
        **Updatable Fields:**
        - Personal information (name, email, phone)
        - Custom question responses
        - Administrative notes
        - Special requirements or accommodations
        
        **Restricted Fields:**
        - Cannot change ticket type after payment
        - Cannot modify order-level information
        - Some changes may require additional validation
        
        **Notifications:**
        - Attendee receives email notification of changes
        - Organizer approval may be required for certain changes
        - Updated information reflects in check-in systems
      operationId: updateAttendee
      security:
        - ApiKeyAuth: []
        - JwtAuth: []
      parameters:
        - $ref: '#/components/parameters/EventId'
        - $ref: '#/components/parameters/AttendeeId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAttendeeRequest'
      responses:
        '200':
          description: Attendee updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttendeeResponse'

    patch:
      tags: [Attendees]
      summary: Partially Update Attendee
      description: |
        Perform partial updates to attendee information using JSON Patch operations.
        
        **Supported Operations:**
        - add: Add new fields or values
        - replace: Update existing field values
        - remove: Remove optional fields
        
        **Common Use Cases:**
        - Update check-in status
        - Add administrative notes
        - Update contact information
        - Modify dietary restrictions or special needs
      operationId: partialUpdateAttendee
      security:
        - ApiKeyAuth: []
        - JwtAuth: []
      parameters:
        - $ref: '#/components/parameters/EventId'
        - $ref: '#/components/parameters/AttendeeId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/JsonPatchOperation'
      responses:
        '200':
          description: Attendee updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttendeeResponse'

    delete:
      tags: [Attendees]
      summary: Delete Attendee Registration
      description: |
        Cancel an attendee registration and handle associated cleanup.
        
        **⚠️ Important Considerations:**
        - May trigger refund processing
        - Frees up event capacity
        - Removes from check-in lists
        - Cancels associated communications
        
        **Refund Handling:**
        - Automatic refund for eligible orders
        - Manual refund processing for complex cases
        - Refund policy enforcement
        - Financial reconciliation
        
        **Data Retention:**
        - Some data may be retained for compliance
        - Analytics data may be anonymized
        - Communication history may be preserved
      operationId: deleteAttendee
      security:
        - JwtAuth: []
      parameters:
        - $ref: '#/components/parameters/EventId'
        - $ref: '#/components/parameters/AttendeeId'
        - name: refund
          in: query
          description: Whether to process automatic refund
          schema:
            type: boolean
            default: true
        - name: reason
          in: query
          description: Reason for cancellation
          schema:
            type: string
            example: "Requested by attendee"
      responses:
        '204':
          description: Attendee registration cancelled successfully
        '409':
          description: Cannot cancel - event has already occurred

  /events/{event_id}/attendees/export:
    post:
      tags: [Attendees]
      summary: Export Attendees
      description: |
        Export attendee data in various formats with customizable field selection.
        
        **Export Formats:**
        - **CSV**: Simple comma-separated values
        - **Excel**: Multiple sheets with formatting
        - **PDF**: Formatted attendee lists for printing
        - **JSON**: Structured data for API integration
        
        **Customization Options:**
        - Select specific fields to include
        - Filter attendees by criteria
        - Custom column headers and formatting
        - Logo and branding inclusion (PDF)
        
        **Field Options:**
        - Basic attendee information
        - Registration and payment details
        - Check-in status and timestamps
        - Custom question responses
